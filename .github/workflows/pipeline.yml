name: DevSecOps CI Pipeline

on:
  push:
    branches:
      - 'feat/devsecops-pipeline'

jobs:
  # --- ETAPA 1: SAST (Checkmarx One) ---
  sast_scan:
    name: Escaneo SAST
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Análisis de Código CxOne
        uses: checkmarx/ast-github-action@main
        with:
          project_name: "pet-clinic"
          base_uri: ${{ secrets.CX_BASE_URI }}
          cx_tenant: ${{ secrets.CX_TENANT }}
          cx_client_id: ${{ secrets.CX_CLIENT_ID }}
          cx_client_secret: ${{ secrets.CX_CLIENT_SECRET }}
          # Así se configura correctamente el bloqueo en la versión actual de CxOne:
          additional_params: --scan-types sast --threshold "sast-medium=1"

  # --- ETAPA 2: SCA (Checkmarx One Dependencias) ---
  sca_scan:
    name: Escaneo SCA
    needs: sast_scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Análisis de Dependencias CxOne
        uses: checkmarx/ast-github-action@main
        with:
          project_name: "pet-clinic"
          base_uri: ${{ secrets.CX_BASE_URI }}
          cx_tenant: ${{ secrets.CX_TENANT }}
          cx_client_id: ${{ secrets.CX_CLIENT_ID }}
          cx_client_secret: ${{ secrets.CX_CLIENT_SECRET }}
          # El parámetro que exige el profe usando la sintaxis correcta:
          additional_params: --scan-types sca --threshold "sca-medium=1"

  # --- ETAPA 3: IMAGEN Y SEGURIDAD (Trivy) ---
  image_security:
    name: Docker Build y Trivy
    needs: sca_scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compilar con Maven
        run: mvn clean package -DskipTests

      - name: Construir Imagen Docker
        run: docker build -t pet-clinic:latest .

      - name: Escaneo Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'pet-clinic:latest'
          severity: 'MEDIUM,HIGH,CRITICAL'
          exit-code: '0'
